<section id="projects" class="projects-section">
    <div class="section-header">
        <h2 class="section-title">MODULES OF PERFORMANCE</h2>
        <div class="pcb-divider"></div>
    </div>
    
    <div class="projects-grid">
        {% for project in site.projects %}
        <div class="project-card">
            <div class="card-circuit-bg"></div>
            <div class="card-content">
                <h3 class="project-title">{{ project.title }}</h3>
                <p class="project-description">{{ project.description }}</p>
                <div class="project-tags">
                    {% for tag in project.tags %}
                    <span class="tag">{{ tag }}</span>
                    {% endfor %}
                </div>
                <div class="project-links">
                    {% if project.github %}
                    <a href="{{ project.github }}" class="btn-card" target="_blank">View Code</a>
                    {% endif %}
                    {% if project.demo %}
                    <a href="{{ project.demo }}" class="btn-card" target="_blank">{{ project.cta }}</a>
                    {% endif %}
                </div>
            </div>
            <div class="card-glow"></div>
        </div>
        {% endfor %}
    </div>
</section>
