<section id="tools" class="tools-section">
    <div class="section-header">
        <h2 class="section-title">TECHNOLOGY STACK</h2>
        <div class="pcb-divider"></div>
    </div>
    
    <div class="tools-container">
        <div class="tools-column">
            <h3 class="tools-subtitle">Tools I Use</h3>
            <div class="tools-grid">
                <div class="tool-item" data-tool="Arduino">
                    <div class="tool-icon">
                        <svg viewBox="0 0 50 50" class="led-icon">
                            <circle cx="25" cy="25" r="20" />
                        </svg>
                    </div>
                    <span class="tool-name">Arduino</span>
                </div>
                <div class="tool-item" data-tool="ESP32">
                    <div class="tool-icon">
                        <svg viewBox="0 0 50 50" class="led-icon">
                            <circle cx="25" cy="25" r="20" />
                        </svg>
                    </div>
                    <span class="tool-name">ESP32</span>
                </div>
                <div class="tool-item" data-tool="Raspberry Pi">
                    <div class="tool-icon">
                        <svg viewBox="0 0 50 50" class="led-icon">
                            <circle cx="25" cy="25" r="20" />
                        </svg>
                    </div>
                    <span class="tool-name">Raspberry Pi</span>
                </div>
                <div class="tool-item" data-tool="FreeRTOS">
                    <div class="tool-icon">
                        <svg viewBox="0 0 50 50" class="led-icon">
                            <circle cx="25" cy="25" r="20" />
                        </svg>
                    </div>
                    <span class="tool-name">FreeRTOS</span>
                </div>
                <div class="tool-item" data-tool="Linux">
                    <div class="tool-icon">
                        <svg viewBox="0 0 50 50" class="led-icon">
                            <circle cx="25" cy="25" r="20" />
                        </svg>
                    </div>
                    <span class="tool-name">Linux</span>
                </div>
                <div class="tool-item" data-tool="OpenCV">
                    <div class="tool-icon">
                        <svg viewBox="0 0 50 50" class="led-icon">
                            <circle cx="25" cy="25" r="20" />
                        </svg>
                    </div>
                    <span class="tool-name">OpenCV</span>
                </div>
                <div class="tool-item" data-tool="PyTorch">
                    <div class="tool-icon">
                        <svg viewBox="0 0 50 50" class="led-icon">
                            <circle cx="25" cy="25" r="20" />
                        </svg>
                    </div>
                    <span class="tool-name">PyTorch</span>
                </div>
                <div class="tool-item" data-tool="TensorFlow">
                    <div class="tool-icon">
                        <svg viewBox="0 0 50 50" class="led-icon">
                            <circle cx="25" cy="25" r="20" />
                        </svg>
                    </div>
                    <span class="tool-name">TensorFlow</span>
                </div>
            </div>
        </div>
        
        <div class="tools-column">
            <h3 class="tools-subtitle">Tools I Build</h3>
            <div class="custom-tools">
                <div class="custom-tool-item">
                    <div class="custom-tool-icon">
                        <svg viewBox="0 0 100 100" class="rotating-circuit">
                            <rect x="30" y="30" width="40" height="40" fill="none" stroke="{{ site.colors.neon_green }}" stroke-width="2"/>
                            <circle cx="50" cy="50" r="15" fill="none" stroke="{{ site.colors.neon_green }}" stroke-width="2"/>
                        </svg>
                    </div>
                    <h4 class="custom-tool-name">embeddedtorch</h4>
                    <p class="custom-tool-desc">Where hardware meets intelligence.</p>
                </div>
                <div class="custom-tool-item">
                    <div class="custom-tool-icon">
                        <svg viewBox="0 0 100 100" class="rotating-circuit">
                            <polygon points="50,20 80,80 20,80" fill="none" stroke="{{ site.colors.neon_green }}" stroke-width="2"/>
                            <circle cx="50" cy="60" r="10" fill="none" stroke="{{ site.colors.neon_green }}" stroke-width="2"/>
                        </svg>
                    </div>
                    <h4 class="custom-tool-name">pyhdl</h4>
                    <p class="custom-tool-desc">Python meets hardware description.</p>
                </div>
            </div>
        </div>
    </div>
</section>
